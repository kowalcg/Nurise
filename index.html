<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nurise Project Dashboard</title>
<style>
  :root { --brand: #2F6F5E; --bg: #F4F5F7; --card: #fff; --ink: #1D2733; --muted: #5E6B7A; --line: #D9DEE5; --err: #B3261E; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11161C; --card: #1A222B; --ink: #E7ECF1; --muted: #9AA7B5; --line: #2C3742; --err: #FF8A80; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
  .card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
          padding: 32px 28px; box-shadow: 0 20px 40px -28px rgba(0,0,0,.4); }
  .bar { height: 5px; border-radius: 3px; background: var(--brand); width: 48px; margin-bottom: 20px; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; line-height: 1.25; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: .95rem; }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; }
  input[type=password] { width: 100%; font: inherit; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line);
          background: var(--bg); color: var(--ink); }
  input[type=password]:focus { outline: none; border-color: var(--brand); }
  .row { display: flex; align-items: center; gap: 8px; margin: 14px 0 20px; font-size: .9rem; color: var(--muted); }
  button { width: 100%; font: 600 1rem inherit; font-family: inherit; padding: 12px; border: 0; border-radius: 10px;
           background: var(--brand); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .msg { min-height: 1.4em; margin-top: 12px; font-size: .9rem; color: var(--err); }
  .foot { margin-top: 22px; font-size: .8rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main class="card">
  <div class="bar"></div>
  <h1>Nurise</h1>
  <p class="sub">Project dashboard · private</p>
  <form id="f" autocomplete="on">
    <label for="pw">Password</label>
    <input type="password" id="pw" name="password" autocomplete="current-password" required autofocus>
    <div class="row"><input type="checkbox" id="remember" checked><label for="remember" style="margin:0;font-weight:400">Keep me signed in on this device for 30 days</label></div>
    <button id="go" type="submit">Open dashboard</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>
  <p class="foot">Prepared by Greg Kowalczyk</p>
</main>
<script>
(function () {
  var msg = document.getElementById("msg"), go = document.getElementById("go");
  var params = new URLSearchParams(location.search);
  var base = location.pathname.replace(/[^/]*$/, "");

  if (!("serviceWorker" in navigator) || !window.crypto || !crypto.subtle || !window.indexedDB) {
    msg.textContent = "This browser can't open the dashboard. Please use a current version of Chrome, Safari, Edge or Firefox (not a private window).";
    go.disabled = true; return;
  }

  function db() {
    return new Promise(function (ok, bad) {
      var r = indexedDB.open("locked-dashboard", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
      r.onsuccess = function () { ok(r.result); }; r.onerror = function () { bad(r.error); };
    });
  }
  function put(k, v) { return db().then(function (d) { return new Promise(function (ok, bad) {
    var t = d.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = ok; t.onerror = function () { bad(t.error); }; }); }); }
  function get(k) { return db().then(function (d) { return new Promise(function (ok) {
    var q = d.transaction("kv").objectStore("kv").get(k); q.onsuccess = function () { ok(q.result); }; q.onerror = function () { ok(); }; }); }); }
  function del(k) { return db().then(function (d) { return new Promise(function (ok) {
    var t = d.transaction("kv", "readwrite"); t.objectStore("kv").delete(k); t.oncomplete = ok; t.onerror = ok; }); }); }

  function hex(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }

  async function manifest(bits) {
    var key = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
    var r = await fetch(base + "vault/m.bin", { cache: "no-store" });
    var b = new Uint8Array(await r.arrayBuffer());
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(0, 12) }, key, b.slice(12));
    return JSON.parse(new TextDecoder().decode(plain));
  }

  async function ready() {
    await navigator.serviceWorker.register(base + "sw.js", { scope: base });
    await navigator.serviceWorker.ready;
    if (!navigator.serviceWorker.controller) {
      await new Promise(function (ok) {
        navigator.serviceWorker.addEventListener("controllerchange", ok, { once: true });
        setTimeout(ok, 3000);
      });
    }
    if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage("reset");
    return !!navigator.serviceWorker.controller;
  }

  function target(m) {
    var next = params.get("next");
    var path = next && next.indexOf("..") < 0 ? next : m.entry;
    return base + path.split("/").map(encodeURIComponent).join("/");
  }

  async function open(m) {
    var controlled = await ready();
    if (!controlled) { location.reload(); return; }
    location.replace(target(m));
  }

  // Already signed in on this device?
  (async function () {
    if (params.has("lock")) { await del("key"); history.replaceState(null, "", base); return; }
    var saved = await get("key");
    if (!saved || !saved.bits || saved.exp < Date.now()) return;
    try { var m = await manifest(saved.bits); go.disabled = true; go.textContent = "Opening…"; await open(m); }
    catch (_) { await del("key"); }
  })();

  document.getElementById("f").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    msg.textContent = ""; go.disabled = true; go.textContent = "Checking…";
    try {
      var k = await (await fetch(base + "vault/k.json", { cache: "no-store" })).json();
      var pwKey = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveBits"]);
      var bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: hex(k.salt), iterations: k.iter }, pwKey, 256));
      var m;
      try { m = await manifest(bits); } catch (_) {
        msg.textContent = "That password isn't right. Check it and try again.";
        go.disabled = false; go.textContent = "Open dashboard"; return;
      }
      var days = document.getElementById("remember").checked ? 30 : 0.5;
      await put("key", { bits: bits, exp: Date.now() + days * 864e5 });
      go.textContent = "Opening…";
      await open(m);
    } catch (e) {
      msg.textContent = "Something went wrong opening the dashboard. Reload the page and try again.";
      go.disabled = false; go.textContent = "Open dashboard";
    }
  });
})();
</script>
</body>
</html>
